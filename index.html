const setBubble=(k,n)=>{bub=[k,n||""];$("#bubble").textContent=t(k).replace("{n}",n||"")};

function applyLang(){
  const admin=location.hash==="#admin";
  document.documentElement.lang=admin?"en":lang;document.documentElement.dir=(admin||lang==="en")?"ltr":"rtl";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
  $("#lang").textContent=lang==="ar"?"EN":"العربية";$("#lang").hidden=admin;
  $("#bubble").textContent=t(bub[0]).replace("{n}",bub[1]);tick();
  if(me)$("#whoName").textContent=me.name.split(" ")[0];
  if(cur===2&&me){setHi();if(wsData)renderWs();else $("#ws").innerHTML=`<div class="card">${t("load")}</div>`;paint()}
  if(cur===3)renderTl();
}
$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("wdLang",lang)}catch(e){}applyLang()};

/* ---------- Snowfall ---------- */
(()=>{const c=$("#snow"),x=c.getContext("2d");let W,H,f=[];
 const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight;f=Array.from({length:Math.min(90,W/12|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.4+.6,v:Math.random()*.7+.3,d:Math.random()*6}))};
 size();addEventListener("resize",size);if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 (function t(){x.clearRect(0,0,W,H);x.fillStyle="rgba(220,238,252,.8)";
  f.forEach(p=>{p.y+=p.v;p.d+=.01;p.x+=Math.sin(p.d)*.4;if(p.y>H+5){p.y=-5;p.x=Math.random()*W}x.globalAlpha=.25+p.r/3.5;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});
  requestAnimationFrame(t)})()})();

/* ---------- Countdown ---------- */
function tick(){const d=new Date("2026-12-17T10:00:00")-new Date(),el=$("#cd");
 if(d<=0){el.innerHTML=`<div class="cdb"><b>${t("today")}</b><small>The Winter Day</small></div>`;return}
 const D=Math.floor(d/864e5),H=Math.floor(d%864e5/36e5),M=Math.floor(d%36e5/6e4);
 el.innerHTML=[[D,"days"],[H,"hours"],[M,"min"]].map(([v,k])=>`<div class="cdb"><b>${v}</b><small>${t(k)}</small></div>`).join("")}
setInterval(tick,30000);

/* ---------- Announcements ---------- */
async function loadAnn(){
  const {data}=await db.from("announcements").select("message").eq("active",true).order("created_at",{ascending:false}).limit(3);
  const el=$("#ann");if(!data||!data.length){el.hidden=true;return}
  el.innerHTML=data.map(a=>`<div>📢 ${esc(a.message)}</div>`).join("");el.hidden=false;
}
setInterval(()=>{if(location.hash!=="#admin")loadAnn()},60000);

/* ---------- Navigation ---------- */
function setHi(){$("#hi").textContent=t("welcome").replace("{n}",me.name.split(" ")[0])}
function go(n){
  if(n>1&&!me)n=1;cur=n;
  document.querySelectorAll(".page").forEach(p=>p.hidden=p.id!=="p"+n);
  document.querySelectorAll("#steps span").forEach(s=>s.classList.toggle("on",+s.dataset.s<=n));
  $("#who").hidden=!me;if(me){$("#whoName").textContent=me.name.split(" ")[0];$("#av").textContent=me.name.trim()[0]?.toUpperCase()||"?"}
  scrollTo(0,0);if(n===2)initP2();if(n===3)initP3();
}
$("#so").onclick=e=>{e.preventDefault();me=null;picked={};stars=0;wsData=null;store();go(1)};

/* ---------- Page 1 ---------- */
$("#n").addEventListener("input",e=>{const f=e.target.value.trim().split(" ")[0];f?setBubble("meet",f):setBubble("greet")});
$("#tUp").onclick=()=>{$("#fUp").hidden=false;$("#fIn").hidden=true;$("#tUp").classList.add("on");$("#tIn").classList.remove("on");say($("#msg1"),"");setBubble("greet")};
$("#tIn").onclick=()=>{$("#fUp").hidden=true;$("#fIn").hidden=false;$("#tIn").classList.add("on");$("#tUp").classList.remove("on");say($("#msg1"),"");setBubble("back")};
const okMobile=v=>/^05\d{8}$/.test(v), okMail=v=>/^\S+@\S+\.\S+$/.test(v);
$("#fUp").addEventListener("submit",async e=>{
  e.preventDefault();const m=$("#msg1");
  const name=$("#n").value.trim(),mobile=$("#m").value.trim(),email=$("#e").value.trim();
  if(name.length<2||!okMobile(mobile)||!okMail(email))return say(m,t("bad"),"e");
  $("#bUp").disabled=true;
  const {data,error}=await db.rpc("register_guest",{p_name:name,p_mobile:mobile,p_email:email,p_sessions:[]});
  $("#bUp").disabled=false;
  if(error)return say(m,err(error.message)+(/already/.test(error.message)?t("usein"):""),"e");
  me={id:data,name};store();picked={};wsData=null;go(2);
});
$("#fIn").addEventListener("submit",async e=>{
  e.preventDefault();const m=$("#msg1");
  const email=$("#se").value.trim(),mobile=$("#sm").value.trim();
  if(!okMail(email)||!okMobile(mobile))return say(m,t("badin"),"e");
  $("#bIn").disabled=true;
  const {data,error}=await db.rpc("login_guest",{p_email:email,p_mobile:mobile});
  $("#bIn").disabled=false;
  if(error)return say(m,err(error.message),"e");
  me={id:data.id,name:data.name};store();picked={};wsData=null;go(2);
});

/* ---------- Page 2 ---------- */
async function fetchSessions(){
  const {data,error}=await db.from("session_availability").select("*").order("workshop_title").order("slot_no");
  if(error){console.error(error);return null}
  byId={};data.forEach(s=>byId[s.id]=s);return data;
}
function renderWs(){
  const by={};wsData.forEach(s=>(by[s.workshop_title]??=[]).push(s));
  $("#ws").innerHTML=Object.entries(by).map(([ti,ss])=>`<div class="card ws"><h3>${esc(ti)}</h3><small>${esc(ss[0].location||"")}</small>
   <div class="slots">${ss.map(s=>{const full=s.seats_left<=0&&!mineSet.has(s.id);
   return `<button type="button" class="slot" data-id="${s.id}" data-slot="${s.slot_no}" ${full?"disabled":""}>${esc(s.time_label)}<span>${full?t("full"):t("left").replace("{n}",s.seats_left)}</span></button>`}).join("")}</div></div>`).join("");
  paint();
}
async function initP2(){
  setHi();$("#sn").textContent=me.name;say($("#msg2"),"");$("#ws").innerHTML=`<div class="card">${t("load")}</div>`;
  const [data,mine]=await Promise.all([fetchSessions(),db.rpc("my_bookings",{p_guest:me.id})]);
  if(!data){$("#ws").innerHTML=`<div class="card">${t("fail")}</div>`;return}
  wsData=data;mineSet=new Set(mine.data||[]);
  if(!Object.keys(picked).length)mineSet.forEach(id=>{if(byId[id])picked[byId[id].slot_no]=id});
  renderWs();
}
function paint(){
  document.querySelectorAll(".slot").forEach(b=>b.classList.toggle("on",picked[b.dataset.slot]===b.dataset.id));
  const lab=n=>Object.values(byId).find(x=>x.slot_no===n)?.time_label||"";
  $("#sched").innerHTML=[1,2].map(n=>{const s=byId[picked[n]];
    return `<div class="srow ${s?"on":""}"><b>${t("slot").replace("{n}",n)}</b><span>${esc(lab(n))}<br>${s?esc(s.workshop_title):t("free")}</span></div>`}).join("");
}
$("#ws").addEventListener("click",e=>{
  const b=e.target.closest(".slot");if(!b||b.disabled)return;
  picked[b.dataset.slot]===b.dataset.id?delete picked[b.dataset.slot]:picked[b.dataset.slot]=b.dataset.id;paint();
});
$("#cont").onclick=async()=>{
  const m=$("#msg2");$("#cont").disabled=true;say(m,t("saving"));
  const wait=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),15000));
  try{
    const {error}=await Promise.race([db.rpc("save_bookings",{p_guest:me.id,p_sessions:Object.values(picked)}),wait]);
    if(error){console.error(error);say(m,err(error.message),"e");initP2();return}
    go(3);
  }catch(ex){console.error(ex);say(m,ex.message==="timeout"?t("slow"):t("wrong")+ex.message,"e")}
  finally{$("#cont").disabled=false}
};

/* ---------- Page 3 ---------- */
function renderTl(){
  $("#tl").innerHTML=tlIds.length?tlIds.map(i=>`<div>${esc(byId[i].workshop_title)} · ${esc(byId[i].time_label)}</div>`).join(""):t("nows");
}
async function initP3(){
  $("#tn").textContent=me.name;$("#pid").textContent=me.id;
  try{
    const q=qrcode(0,"M");q.addData(me.id);q.make();
    $("#qr").innerHTML=q.createImgTag(8,0,"Your QR code");$("#qr").hidden=false;$("#qrErr").hidden=true;
  }catch(ex){console.error("QR error:",ex);$("#qr").hidden=true;$("#qrErr").hidden=false}
  try{
    const [data,mine]=await Promise.all([fetchSessions(),db.rpc("my_bookings",{p_guest:me.id})]);
    tlIds=(mine.data||[]).filter(i=>byId[i]);renderTl();
  }catch(ex){console.error(ex)}
}
$("#edit").onclick=()=>go(2);
$("#calBtn").onclick=()=>{ // calendar file: all-day event + one event per booked session
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Winter Day//EN",
   "BEGIN:VEVENT","UID:wd-day-"+me.id+"@winterday","DTSTAMP:20261101T000000Z","DTSTART;VALUE=DATE:20261217","DTEND;VALUE=DATE:20261218","SUMMARY:The Winter Day - Elevate Events","END:VEVENT"];
  tlIds.forEach((i,n)=>{const s=byId[i],p=s.time_label.split(/\s*[-–]\s*/),f=x=>"20261217T"+x.replace(":","")+"00";
   L.push("BEGIN:VEVENT","UID:wd-"+n+"-"+me.id+"@winterday","DTSTAMP:20261101T000000Z","DTSTART:"+f(p[0]),"DTEND:"+f(p[1]),"SUMMARY:"+s.workshop_title+" - The Winter Day","END:VEVENT")});
  L.push("END:VCALENDAR");
  const a=document.createElement("a");a.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(L.join("\r\n"));a.download="winter-day.ics";a.click();
};
const paintStars=()=>document.querySelectorAll("#stars button").forEach(b=>b.classList.toggle("on",+b.dataset.v<=stars));
$("#stars").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;stars=+b.dataset.v;paintStars()});
$("#rate").onclick=async()=>{
  const m=$("#msg3");if(!stars)return say(m,t("pick"),"e");
  const {error}=await db.rpc("submit_rating",{p_guest:me.id,p_stars:stars,p_comment:$("#cm").value});
  error?say(m,error.message,"e"):say(m,t("thanks"),"g");
};

/* ---------- Admin ---------- */
async function initAdmin(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){$("#lf").hidden=false;$("#panel").hidden=true;return}
  const {data:ok}=await db.rpc("is_admin");
  if(!ok){$("#lmsg").textContent="This account does not have admin access.";$("#panel").hidden=true;return}
  $("#lf").hidden=true;$("#lmsg").textContent="";$("#panel").hidden=false;loadAdmin();
}
$("#lf").addEventListener("submit",async e=>{
  e.preventDefault();
  const {error}=await db.auth.signInWithPassword({email:$("#ae").value.trim(),password:$("#ap").value});
  if(error)$("#lmsg").textContent="Incorrect email or password.";else initAdmin();
});
async function loadAdmin(){
  const [g,s,r,at,an]=await Promise.all([
    db.from("guests").select("id,name,mobile,email,checked_in,created_at,bookings(sessions(slot_no,time_label,workshops(title)))").order("created_at",{ascending:false}),
    db.from("session_availability").select("*").order("workshop_title").order("slot_no"),
    db.from("ratings").select("stars,comment,created_at,guests(name)").order("created_at",{ascending:false}),
    db.from("session_attendance").select("session_id"),
    db.from("announcements").select("id,message,active").order("created_at",{ascending:false}).limit(8)]);
  const bad=g.error||s.error||r.error||at.error||an.error;
  if(bad){$("#amsg").className="msg e";$("#amsg").textContent=bad.message;return}
  guests=g.data;
  const avg=r.data.length?(r.data.reduce((a,x)=>a+x.stars,0)/r.data.length).toFixed(1):"–";
  $("#stats").innerHTML=[["Registered",guests.length],["Checked in",guests.filter(x=>x.checked_in).length],["Workshop bookings",guests.reduce((a,x)=>a+x.bookings.length,0)],["Avg. rating",avg+" ★"]]
    .map(([k,v])=>`<div class="card"><span class="stat">${v}</span><small>${k}</small></div>`).join("");
  const att={};at.data.forEach(x=>att[x.session_id]=(att[x.session_id]||0)+1);
  $("#sess").innerHTML="<tr><th>Workshop</th><th>Time</th><th>Booked</th><th>Fill</th><th>Left</th><th>Attended</th></tr>"+
    s.data.map(x=>{const b=x.capacity-x.seats_left;return `<tr><td>${esc(x.workshop_title)}</td><td>${esc(x.time_label)}</td><td>${b}/${x.capacity}</td><td><div class="pb"><i style="width:${Math.round(b/x.capacity*100)}%"></i></div></td><td>${x.seats_left}</td><td>${att[x.id]||0}</td></tr>`}).join("");
  const keep=$("#mode").value;
  $("#mode").innerHTML='<option value="">Event entrance (check-in)</option>'+s.data.map(x=>`<option value="${x.id}">${esc(x.workshop_title)} · ${esc(x.time_label)}</option>`).join("");
  $("#mode").value=keep;
  $("#rt").innerHTML="<tr><th>Guest</th><th>Stars</th><th>Comment</th></tr>"+
    (r.data.map(x=>`<tr><td>${esc(x.guests?.name)}</td><td>${"★".repeat(x.stars)}</td><td>${esc(x.comment)||"—"}</td></tr>`).join("")||'<tr><td colspan="3">No ratings yet</td></tr>');
  $("#annList").innerHTML=an.data.map(a=>`<div style="display:flex;gap:10px;align-items:center;margin:8px 0;${a.active?"":"opacity:.45"}"><span style="flex:1">${esc(a.message)}</span>
   <button class="btn alt" data-a="${a.id}" data-on="${a.active?1:0}">${a.active?"Hide":"Show"}</button><button class="btn alt" data-ad="${a.id}">Delete</button></div>`).join("");
  renderGuests();
}
$("#annGo").onclick=async()=>{
  const v=$("#annTxt").value.trim(),m=$("#annMsg");if(!v)return say(m,"Write a message first.","e");
  const {error}=await db.from("announcements").insert({message:v});
  if(error)return say(m,error.message,"e");$("#annTxt").value="";say(m,"Published ✓","g");loadAdmin();
};
$("#annList").addEventListener("click",async e=>{
  const a=e.target.dataset.a,d=e.target.dataset.ad;
  if(a)await db.from("announcements").update({active:e.target.dataset.on!=="1"}).eq("id",a);
  if(d)await db.from("announcements").delete().eq("id",d);
  if(a||d)loadAdmin();
});
const wsText=x=>x.bookings.map(b=>`${b.sessions.workshops.title} (${b.sessions.time_label})`).join(", ");
function renderGuests(){
  const q=$("#q").value.trim().toLowerCase();
  const rows=guests.filter(x=>!q||[x.name,x.mobile,x.email].some(v=>v.toLowerCase().includes(q)));
  $("#gt").innerHTML="<tr><th>Name</th><th>Mobile</th><th>Email</th><th>Workshops</th><th>Status</th><th class=\"noprint\"></th></tr>"+
   rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.mobile)}</td><td>${esc(x.email)}</td><td>${esc(wsText(x))||"—"}</td>
   <td>${x.checked_in?'<span class="ok">Checked in</span>':"—"}</td>
   <td style="white-space:nowrap"><button class="btn alt" data-t="${x.id}">${x.checked_in?"Undo":"Check in"}</button>
   <button class="btn alt" data-d="${x.id}">Delete</button></td></tr>`).join("");
}
$("#q").oninput=renderGuests;
$("#gt").addEventListener("click",async e=>{
  const t2=e.target.dataset.t,d=e.target.dataset.d;
  if(t2){const g=guests.find(x=>x.id===t2);await db.from("guests").update({checked_in:!g.checked_in}).eq("id",t2);loadAdmin()}
  if(d&&confirm("Permanently delete this guest and their bookings?")){await db.from("guests").delete().eq("id",d);loadAdmin()}
});
$("#ci").onclick=async()=>{
  const id=$("#code").value.trim(),m=$("#amsg");
  const {data,error}=await db.from("guests").update({checked_in:true}).eq("id",id).select("name");
  const bd=error||!data?.length;m.className="msg "+(bd?"e":"g");
  m.textContent=bd?"Invalid code":`Checked in: ${data[0].name}`;$("#code").value="";loadAdmin();
};
$("#code").addEventListener("keydown",e=>{if(e.key==="Enter")$("#ci").click()});
$("#csv").onclick=()=>{
  const c=v=>`"${String(v).replace(/"/g,'""')}"`;
  const rows=[["Name","Mobile","Email","Workshops","Checked in"],...guests.map(x=>[x.name,x.mobile,x.email,wsText(x),x.checked_in?"Yes":"No"])];
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(c).join(",")).join("\n")],{type:"text/csv"}));
  a.download="winter-day-guests.csv";a.click();
};
$("#prt").onclick=()=>window.print();

/* ---------- QR scanner (organizers) ---------- */
let scanner=null,busy=false;
async function stopScan(){
  try{await scanner.stop();scanner.clear()}catch(e){}
  scanner=null;$("#scanBtn").textContent="Start scanning";
}
$("#scanBtn").onclick=async()=>{
  if(scanner)return stopScan();
  scanner=new Html5Qrcode("reader");
  try{
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:240},onScan,()=>{});
    $("#scanBtn").textContent="Stop scanning";
  }catch(ex){
    console.error(ex);scanner=null;
    say($("#scanMsg"),"Could not open the camera. Allow camera access and use the https link.","e");
  }
};
async function onScan(text){
  if(busy)return;busy=true;
  const m=$("#scanMsg"),id=text.trim(),mode=$("#mode").value;
  try{
    if(!/^[0-9a-f-]{36}$/i.test(id)){say(m,"This is not a Winter Day pass.","e");return}
    const {data:g}=await db.from("guests").select("name,checked_in").eq("id",id).maybeSingle();
    if(!g){say(m,"Invalid pass.","e");return}
    if(!mode){ // event entrance
      if(g.checked_in){say(m,"Already checked in: "+g.name,"e");return}
      const {error}=await db.from("guests").update({checked_in:true}).eq("id",id);
      error?say(m,error.message,"e"):(say(m,"✓ Checked in: "+g.name,"g"),loadAdmin());
    }else{ // workshop session
      const {data:b}=await db.from("bookings").select("id").eq("guest_id",id).eq("session_id",mode).maybeSingle();
      if(!b){say(m,g.name+" is not booked in this session.","e");return}
      const {error}=await db.from("session_attendance").insert({guest_id:id,session_id:mode});
      if(error){say(m,error.code==="23505"?"Already marked: "+g.name:error.message,"e");return}
      await db.from("guests").update({checked_in:true}).eq("id",id);
      say(m,"✓ Attended: "+g.name,"g");loadAdmin();
    }
  }finally{setTimeout(()=>busy=false,2000)}
}
$("#out").onclick=async()=>{if(scanner)await stopScan();await db.auth.signOut();initAdmin()};

/* ---------- Routing ---------- */
function route(){
  const a=location.hash==="#admin";$("#pub").hidden=a;$("#adm").hidden=!a;$("#ann").hidden=true;
  applyLang();
  if(a)initAdmin();else{go(cur);loadAnn()}
}
addEventListener("hashchange",route);route();
